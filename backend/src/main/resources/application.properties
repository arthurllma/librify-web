# ── H2 (desenvolvimento local) ──────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:librifydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA ─────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── JWT ─────────────────────────────────────────────────────────────────────
librify.jwt.secret=librify-super-secret-key-jwt-auth-2024-change-in-prod
librify.jwt.expiration=86400000

# ── PostgreSQL (produção) ────────────────────────────────────────────────────
# Descomente abaixo e comente o bloco H2 ao usar PostgreSQL:
# spring.datasource.url=jdbc:postgresql://localhost:5432/librifydb
