<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librify – Cadastro</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<div class="login-container">
    <div class="logo-icon">📖</div>
    <h1>Criar conta</h1>
    <p class="subtitle">Junte-se à Librify</p>

    <div id="alertMsg" class="alert"></div>

    <form id="cadastroForm">
        <div class="input-group">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" placeholder="Seu nome" autocomplete="name">
        </div>
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
        </div>
        <div class="input-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Mín. 8 caracteres, 1 maiúscula, 1 número">
        </div>
        <button type="submit" class="btn btn-dark">Cadastrar</button>
    </form>

    <div class="links-container">
        <a href="../index.html">Já tem uma conta? Login</a>
    </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/cadastro.js"></script>
</body>
</html>
