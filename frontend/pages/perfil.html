<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Librify – Perfil</title>

<div class="page-container">

            <span class="action-arrow">›</span>

        <a href="configuracoes.html" class="action-item">
            <span class="action-icon">⚙️</span>
            <span class="action-label">Configurações</span>
