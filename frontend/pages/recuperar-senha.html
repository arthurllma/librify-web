<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librify – Recuperar Senha</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
    <style>
        .login-container { max-width: 400px; }
        /* RF03.3 – seta de voltar */
        .back-arrow {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            text-decoration: none;
            color: var(--dark);
        }
        body { position: relative; }
    </style>
</head>
<body>

<a href="../index.html" class="back-arrow">←</a>

<div class="login-container">
    <div class="logo-icon">🔑</div>
    <h1>Recuperar Senha</h1>
    <p class="subtitle">Informe seu email cadastrado e enviaremos as instruções de recuperação.</p>

    <div id="alertMsg" class="alert"></div>

    <form id="recuperarForm">
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
        </div>
        <button type="submit" class="btn btn-dark">Enviar instruções</button>
    </form>

    <div class="links-container" style="margin-top:16px">
        <a href="../index.html">← Voltar para o login</a>
    </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/recuperar-senha.js"></script>
</body>
</html>
